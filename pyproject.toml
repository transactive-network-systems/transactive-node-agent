[build-system]
requires = ["poetry-core>=1.2.2"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
volttron-transactive-node = "transactive_node.agent:main"

[tool.isort]
profile = "black"

[tool.poetry]
name = "volttron-transactive-node"
version = "0.1.0"
description = "VOLTTRON agent that runs a TENT transactive node on the message bus"
authors = ["TENT Team <volttron@pnnl.gov>"]
license = "Apache License 2.0"
readme = "README.md"
repository = "https://github.com/volttron/TransactiveNodeAgent"
homepage = "https://github.com/volttron/TransactiveNodeAgent"
keywords = []
packages = [ { include = "transactive_node", from = "src" }]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Developers",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: Apache Software License"
]

[tool.poetry.dependencies]
python = "^3.11"
volttron-core = ">=2.0.0rc0"
gevent = ">=23.0"
# tent (code/TENT in this project) is required and is not on PyPI. Install it into the platform's environment before
# this agent, with `pip install -e ../TENT` or `vctl install-lib ../TENT`.

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.yapf]
based_on_style = "pep8"
spaces_before_comment = 4
column_limit = 99
split_before_logical_operator = true

[tool.yapfignore]
ignore_patterns = [
    ".venv/**",
    ".pytest_cache/**",
    "dist/**",
    "docs/**"
]